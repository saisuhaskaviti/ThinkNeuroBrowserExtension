<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pause Point</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body style="background-color: var(--surface); color: var(--on-surface);" class="h-screen w-screen font-sans overflow-hidden select-none">

  <!-- Full-page layout: top bar | center blob | bottom sheet -->
  <div class="h-full flex flex-col items-center justify-between px-6 py-10">

    <!-- ── TOP STATUS PILL ── -->
    <div class="flex flex-col items-center gap-3 w-full">
      <div style="background-color: var(--surface-container);" class="px-5 py-2 rounded-full flex items-center gap-2.5 shadow-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color: var(--secondary);">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/>
        </svg>
        <span id="domain-label" style="color: var(--on-surface-variant);" class="text-sm font-medium domain-chip">Pause Point</span>
      </div>
      <h1 style="color: var(--on-surface);" class="text-3xl font-medium tracking-tight mt-1">Why am I here?</h1>
    </div>

    <!-- ── CENTER BREATHING BLOB ── -->
    <div class="flex flex-col items-center gap-6 flex-1 justify-center">
      <!-- Blob container — fixed size so animation stays inside -->
      <div class="relative w-56 h-56 flex items-center justify-center">
        <!-- Glow layer (behind blob) -->
        <div class="breathing-blob blob-glow absolute w-56 h-56"
             style="background-color: var(--primary); border-radius: 62% 38% 46% 54% / 60% 44% 56% 40%;"></div>
        <!-- Text inside blob -->
        <span id="breathing-text"
              style="color: var(--on-primary);"
              class="relative z-10 text-xl font-semibold tracking-wide transition-opacity duration-300 ease-in-out">
          Breathe in
        </span>
      </div>

      <!-- Countdown text below blob -->
      <p style="color: var(--on-surface-variant);" class="text-sm font-medium">
        Opening in <span id="countdown" style="color: var(--secondary);" class="font-bold">10</span>s
      </p>
    </div>

    <!-- ── BOTTOM ACTIONS ── -->
    <div class="flex flex-col items-center w-full max-w-xs gap-3">

      <!-- Primary Escape Button -->
      <button id="escape-btn"
              style="background-color: var(--secondary); color: var(--on-secondary);"
              class="w-full py-4 rounded-[28px] text-base font-semibold tracking-wide shadow-md hover:brightness-110 active:scale-95 transition-all">
        Don't open
      </button>

      <!-- Continue button — plain text, unlocks after 10s -->
      <button id="continue-btn"
              style="color: var(--secondary);"
              class="w-full py-3 rounded-2xl text-sm font-medium opacity-40 cursor-not-allowed transition-opacity"
              disabled>
        Open site anyway
      </button>

    </div>
  </div>

  <script src="pause.js"></script>
</body>
</html>
